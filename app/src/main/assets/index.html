<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#061A3A">

<title>Police AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   POLICE AI — RESPONSIVE STAGE 2
   ========================================================= */

:root {
  --bg: #f7f9fc;
  --panel: #ffffff;
  --panel2: #f1f5f9;
  --text: #101828;
  --muted: #667085;
  --border: #e4e7ec;
  --accent: #2563eb;
  --accent2: #0ea5e9;
  --user: #e8f0ff;
  --assistant: #ffffff;
  --danger: #dc2626;
  --shadow: 0 6px 25px rgba(15,23,42,.08);
}

[data-theme="dark"] {
  --bg: #080c13;
  --panel: #0f1722;
  --panel2: #121c29;
  --text: #f3f6fb;
  --muted: #9aa8ba;
  --border: #233044;
  --accent: #3b82f6;
  --accent2: #22d3ee;
  --user: #12284b;
  --assistant: #0f1722;
  --danger: #ef4444;
  --shadow: 0 8px 30px rgba(0,0,0,.32);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background: var(--bg);
  color: var(--text);
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  overscroll-behavior: none;
}


/* =========================================================
   RESPONSIVE ROOT
   ========================================================= */

#app {
  position: relative;

  width: 100%;
  height: 100%;

  height: 100dvh;

  min-height: 0;

  display: flex;
  flex-direction: column;

  overflow: hidden;

  background: var(--bg);

  opacity: 0;
  transform: scale(.99);

  transition:
    opacity .4s ease,
    transform .4s ease;
}

#app.ready {
  opacity: 1;
  transform: scale(1);
}


/* =========================================================
   STAGE 2 WELCOME SCREEN
   ========================================================= */

#welcomeScreen {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;
  height: 100dvh;

  z-index: 9999;

  display: flex;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: #061A3A;

  opacity: 1;
  visibility: visible;

  transition:
    opacity .55s ease,
    visibility .55s ease;
}

#welcomeScreen.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}


/*
  IMPORTANT:
  The image is now CONTAINED.

  This prevents the landscape image from being
  cropped on portrait phones.
*/

.welcome-image {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: contain;

  object-position: center center;

  background: #061A3A;

  animation: welcomeZoom 8s ease-in-out infinite alternate;
}


/*
  Very subtle background glow behind the image.
*/

.welcome-background {
  position: absolute;

  inset: -20%;

  background:
    radial-gradient(
      circle at center,
      rgba(14,165,233,.18),
      transparent 55%
    );

  pointer-events: none;
}


/*
  Bottom gradient makes the button readable
  without covering the image.
*/

.welcome-gradient {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 32%;

  background:
    linear-gradient(
      to top,
      rgba(3,10,28,.92),
      rgba(3,10,28,.42),
      transparent
    );

  pointer-events: none;
}


.welcome-content {
  position: absolute;

  left: 0;
  right: 0;
  bottom: max(
    22px,
    env(safe-area-inset-bottom)
  );

  z-index: 3;

  display: flex;

  flex-direction: column;

  align-items: center;

  padding:
    16px
    18px
    max(
      14px,
      env(safe-area-inset-bottom)
    );

  animation:
    welcomeContent .8s ease both;
}


.welcome-start {
  min-width: clamp(165px, 52vw, 210px);

  min-height: clamp(44px, 6vh, 52px);

  padding:
    10px
    25px;

  border: 0;

  border-radius: 28px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #0ea5e9
    );

  color: white;

  font-size: clamp(13px, 3.5vw, 15px);

  font-weight: 800;

  letter-spacing: .2px;

  box-shadow:
    0 8px 30px rgba(37,99,235,.42);

  cursor: pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.welcome-start:active {
  transform: scale(.96);
}

.welcome-hint {
  margin-top: 9px;

  color: rgba(255,255,255,.75);

  font-size: clamp(9px, 2.5vw, 11px);

  text-align: center;
}


/* =========================================================
   HEADER
   ========================================================= */

header {
  flex: 0 0 auto;

  min-height: 56px;

  height: clamp(54px, 7vh, 62px);

  display: flex;

  align-items: center;
  justify-content: space-between;

  padding:
    0
    max(
      10px,
      env(safe-area-inset-left)
    )
    0
    max(
      10px,
      env(safe-area-inset-right)
    );

  background: var(--panel);

  border-bottom: 1px solid var(--border);

  z-index: 20;
}


.brand {
  display: flex;

  align-items: center;

  gap: 8px;

  min-width: 0;
}


.logo {
  width: clamp(32px, 9vw, 38px);

  height: clamp(32px, 9vw, 38px);

  flex: 0 0 auto;

  animation:
    logoFloat 4s ease-in-out infinite;
}


.brand-text {
  min-width: 0;
}


.brand-title {
  font-size: clamp(14px, 4vw, 16px);

  font-weight: 800;

  line-height: 18px;

  white-space: nowrap;
}


.brand-subtitle {
  font-size: clamp(7px, 2.3vw, 9px);

  letter-spacing: 1.1px;

  color: var(--muted);

  font-weight: 700;
}


.header-actions {
  display: flex;

  align-items: center;

  gap: 5px;
}


.icon-btn {
  width: clamp(34px, 10vw, 39px);

  height: clamp(34px, 10vw, 39px);

  border:
    1px solid
    var(--border);

  border-radius: 10px;

  background: var(--panel2);

  color: var(--text);

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 16px;

  cursor: pointer;
}


.icon-btn:active {
  transform: scale(.92);
}


/* =========================================================
   LAW BAR
   ========================================================= */

.law-bar {
  flex: 0 0 auto;

  min-height: 40px;

  height: clamp(40px, 5vh, 45px);

  display: flex;

  align-items: center;

  padding:
    0
    max(
      10px,
      env(safe-area-inset-left)
    );

  background: var(--panel);

  border-bottom: 1px solid var(--border);
}


.law-select {
  max-width: 100%;

  min-width: min(150px, 60vw);

  border:
    1px solid
    var(--border);

  border-radius: 9px;

  background: var(--panel2);

  color: var(--text);

  padding:
    6px
    9px;

  font-size: 11px;

  font-weight: 700;

  outline: none;
}


/* =========================================================
   CHAT
   ========================================================= */

#chat {
  flex: 1 1 auto;

  min-height: 0;

  width: 100%;

  overflow-x: hidden;
  overflow-y: auto;

  padding:
    clamp(8px, 2vw, 14px)
    clamp(8px, 2.5vw, 12px)
    7px;

  display: flex;

  flex-direction: column;

  gap: clamp(7px, 1.5vw, 10px);

  scroll-behavior: smooth;

  overscroll-behavior: contain;
}


#chat::-webkit-scrollbar {
  width: 4px;
}

#chat::-webkit-scrollbar-thumb {
  background: var(--border);

  border-radius: 10px;
}


/* =========================================================
   WELCOME CHAT
   ========================================================= */

.chat-welcome {
  width: min(94%, 540px);

  margin:
    clamp(4px, 1vh, 10px)
    auto
    3px;

  text-align: center;

  animation:
    fadeUp .45s ease both;
}


.chat-welcome-icon {
  width: clamp(48px, 14vw, 62px);

  height: clamp(48px, 14vw, 62px);

  margin:
    3px
    auto
    8px;

  animation:
    logoFloat 4s ease-in-out infinite,
    softGlow 3s ease-in-out infinite alternate;
}


.chat-welcome h1 {
  margin: 0;

  font-size: clamp(19px, 6vw, 23px);

  letter-spacing: -.3px;
}


.chat-welcome p {
  margin:
    5px
    0
    12px;

  color: var(--muted);

  font-size: clamp(10px, 3vw, 12px);
}


/* =========================================================
   SUGGESTIONS
   ========================================================= */

.suggestions {
  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 6px;
}


.suggestion {
  max-width: 100%;

  border:
    1px solid
    var(--border);

  background: var(--panel);

  color: var(--text);

  border-radius: 16px;

  padding:
    7px
    10px;

  font-size: clamp(9px, 2.8vw, 11px);

  cursor: pointer;
}


.suggestion:active {
  transform: scale(.97);
}


/* =========================================================
   MESSAGE
   ========================================================= */

.message-row {
  display: flex;

  width: 100%;

  margin: 0;

  animation:
    messageIn .25s ease both;
}


.message-row.user {
  justify-content: flex-end;
}


.message-row.assistant {
  justify-content: flex-start;
}


.message {
  width: fit-content;

  max-width: min(90%, 720px);

  border-radius: 14px;

  padding:
    8px
    10px;

  line-height: 1.48;

  font-size: clamp(12px, 3.4vw, 13px);

  white-space: pre-wrap;

  word-break: break-word;

  border:
    1px solid
    var(--border);

  box-shadow:
    0 2px 8px rgba(0,0,0,.025);
}


.message.user {
  background: var(--user);

  border-color:
    rgba(37,99,235,.16);
}


.message.assistant {
  background: var(--assistant);
}


.message strong {
  font-weight: 750;
}


.message-actions {
  display: flex;

  flex-wrap: wrap;

  gap: 4px;

  margin-top: 7px;
}


.small-btn {
  border:
    1px solid
    var(--border);

  background: var(--panel2);

  color: var(--muted);

  border-radius: 8px;

  padding:
    5px
    8px;

  font-size: 9px;

  cursor: pointer;
}


/* =========================================================
   SOURCE CARD
   ========================================================= */

.source-card {
  width: 100%;

  max-width: 100%;

  margin-top: 7px;

  border:
    1px solid
    var(--border);

  background: var(--panel2);

  border-radius: 9px;

  padding:
    6px
    8px;

  font-size: 9px;

  animation:
    sourceIn .3s ease both;
}


.source-title {
  font-size: 9px;

  font-weight: 800;

  margin-bottom: 2px;
}


.source-item {
  display: flex;

  align-items: flex-start;

  gap: 6px;

  padding: 2px 0;

  line-height: 1.25;

  color: var(--muted);
}


.source-label {
  flex: 0 0 auto;

  color: var(--text);

  font-weight: 700;
}


/* =========================================================
   TYPING
   ========================================================= */

.typing {
  display: inline-flex;

  align-items: center;

  gap: 4px;

  padding: 3px 2px;
}


.dot {
  width: 5px;

  height: 5px;

  border-radius: 50%;

  background: var(--accent);

  animation:
    typingDot 1.1s infinite ease-in-out;
}


.dot:nth-child(2) {
  animation-delay: .15s;
}


.dot:nth-child(3) {
  animation-delay: .3s;
}


/* =========================================================
   COMPOSER
   ========================================================= */

.composer-wrap {
  flex: 0 0 auto;

  width: 100%;

  padding:
    6px
    max(
      8px,
      env(safe-area-inset-right)
    )
    max(
      6px,
      env(safe-area-inset-bottom)
    )
    max(
      8px,
      env(safe-area-inset-left)
    );

  background: var(--bg);

  border-top:
    1px solid
    var(--border);
}


.composer {
  width: 100%;

  min-height: 46px;

  display: flex;

  align-items: flex-end;

  gap: 5px;

  padding: 4px;

  background: var(--panel);

  border:
    1px solid
    var(--border);

  border-radius: 14px;

  box-shadow: var(--shadow);
}


#question {
  flex: 1 1 auto;

  min-width: 0;

  width: 100%;

  height: 38px;

  max-height: 105px;

  resize: none;

  overflow-y: auto;

  border: 0;

  outline: 0;

  background: transparent;

  color: var(--text);

  padding:
    8px
    7px;

  font-family: inherit;

  font-size: 13px;

  line-height: 20px;
}


#question::placeholder {
  color: var(--muted);
}


.send-btn,
.mic-btn {
  width: 36px;

  height: 36px;

  min-width: 36px;

  min-height: 36px;

  flex: 0 0 36px;

  border: 0;

  border-radius: 10px;

  display: flex;

  align-items: center;

  justify-content: center;

  cursor: pointer;

  font-size: 15px;
}


.send-btn {
  background: var(--accent);

  color: white;
}


.mic-btn {
  background: var(--panel2);

  color: var(--text);

  border:
    1px solid
    var(--border);
}


.mic-btn.recording {
  background: #dc2626;

  color: white;

  animation:
    micPulse 1s infinite;
}


.footer-note {
  text-align: center;

  color: var(--muted);

  font-size: 8px;

  margin-top: 4px;

  opacity: .75;
}


/* =========================================================
   VOICE OVERLAY
   ========================================================= */

#voiceOverlay {
  position: fixed;

  inset: 0;

  z-index: 10000;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  background:
    radial-gradient(
      circle at center,
      rgba(20,74,150,.78),
      rgba(3,8,20,.97)
    );

  backdrop-filter: blur(12px);

  padding:
    20px;
}


#voiceOverlay.active {
  display: flex;
}


.voice-orb {
  width: clamp(105px, 32vw, 140px);

  height: clamp(105px, 32vw, 140px);

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: clamp(44px, 13vw, 56px);

  background:
    radial-gradient(
      circle,
      #38bdf8 0%,
      #2563eb 45%,
      #172554 72%
    );

  box-shadow:
    0 0 0 12px rgba(37,99,235,.12),
    0 0 0 28px rgba(37,99,235,.06),
    0 0 55px rgba(14,165,233,.55);

  animation:
    voiceOrb 1.35s infinite ease-in-out;
}


.voice-title {
  margin-top: 22px;

  color: white;

  font-size: clamp(19px, 6vw, 23px);

  font-weight: 800;
}


.voice-status {
  margin-top: 6px;

  color: rgba(255,255,255,.72);

  font-size: 12px;

  text-align: center;
}


.voice-waves {
  display: flex;

  align-items: center;

  justify-content: center;

  gap: 4px;

  height: 42px;

  margin-top: 16px;
}


.wave {
  width: 4px;

  height: 12px;

  border-radius: 10px;

  background: #38bdf8;

  animation:
    wave 1s infinite ease-in-out;
}


.wave:nth-child(2) {
  animation-delay: .1s;
}

.wave:nth-child(3) {
  animation-delay: .2s;
}

.wave:nth-child(4) {
  animation-delay: .3s;
}

.wave:nth-child(5) {
  animation-delay: .4s;
}


.stop-recording {
  margin-top: 25px;

  border:
    1px solid
    rgba(255,255,255,.2);

  background:
    rgba(255,255,255,.08);

  color: white;

  border-radius: 24px;

  padding:
    9px
    20px;

  font-size: 11px;

  cursor: pointer;
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes welcomeZoom {

  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.025);
  }

}


@keyframes welcomeContent {

  from {
    opacity: 0;
    transform: translateY(18px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


@keyframes logoFloat {

  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-2px);
  }

}


@keyframes softGlow {

  from {
    filter:
      drop-shadow(
        0 0 2px
        rgba(37,99,235,.15)
      );
  }

  to {
    filter:
      drop-shadow(
        0 0 9px
        rgba(37,99,235,.45)
      );
  }

}


@keyframes fadeUp {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


@keyframes messageIn {

  from {
    opacity: 0;
    transform:
      translateY(4px)
      scale(.99);
  }

  to {
    opacity: 1;
    transform:
      translateY(0)
      scale(1);
  }

}


@keyframes sourceIn {

  from {
    opacity: 0;
    transform: translateY(3px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


@keyframes typingDot {

  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .45;
  }

  30% {
    transform: translateY(-4px);
    opacity: 1;
  }

}


@keyframes micPulse {

  0%, 100% {
    box-shadow:
      0 0 0 0
      rgba(220,38,38,.3);
  }

  50% {
    box-shadow:
      0 0 0 7px
      rgba(220,38,38,.08);
  }

}


@keyframes voiceOrb {

  0%, 100% {
    transform: scale(.96);
  }

  50% {
    transform: scale(1.05);
  }

}


@keyframes wave {

  0%, 100% {
    height: 10px;
    opacity: .5;
  }

  50% {
    height: 36px;
    opacity: 1;
  }

}


/* =========================================================
   LANDSCAPE PHONES
   ========================================================= */

@media (orientation: landscape) and (max-height: 500px) {

  header {
    height: 48px;
    min-height: 48px;
  }

  .law-bar {
    height: 36px;
    min-height: 36px;
  }

  .chat-welcome {
    margin-top: 2px;
  }

  .chat-welcome-icon {
    width: 40px;
    height: 40px;

    margin-bottom: 3px;
  }

  .chat-welcome p {
    margin: 2px 0 6px;
  }

  .composer-wrap {
    padding-top: 4px;
  }

  .footer-note {
    display: none;
  }

  .welcome-content {
    bottom: 8px;
  }

  .welcome-start {
    min-height: 40px;
  }

  .welcome-hint {
    display: none;
  }

}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media (max-width: 340px) {

  .brand-subtitle {
    display: none;
  }

  .message {
    max-width: 94%;
  }

  .suggestion {
    padding: 6px 8px;
  }

}


/* =========================================================
   TALL PHONES
   ========================================================= */

@media (min-height: 800px) and (orientation: portrait) {

  .chat-welcome {
    margin-top: 20px;
  }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration: .01ms !important;

    animation-iteration-count: 1 !important;

    transition-duration: .01ms !important;
  }

}

</style>
</head>


<body>


<!-- =======================================================
     STAGE 2 WELCOME SCREEN
     ======================================================= -->

<div id="welcomeScreen">

  <div class="welcome-background"></div>

  <img
    id="welcomeImage"
    class="welcome-image"
    src="welcome_screen.png"
    alt="Police AI Law Assistant"
  >

  <div class="welcome-gradient"></div>

  <div class="welcome-content">

    <button
      id="startAppBtn"
      class="welcome-start"
      type="button"
    >
      Get Started
    </button>

    <div class="welcome-hint">
      AI-powered assistance for your legal knowledge
    </div>

  </div>

</div>


<!-- =======================================================
     MAIN APP
     ======================================================= -->

<div id="app">


  <!-- HEADER -->

  <header>

    <div class="brand">

      <svg
        class="logo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
      >

        <defs>

          <linearGradient
            id="shieldGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >

            <stop
              offset="0%"
              stop-color="#2563EB"
            />

            <stop
              offset="100%"
              stop-color="#0EA5E9"
            />

          </linearGradient>

        </defs>

        <path
          d="M50 6
             L88 20
             L82 57
             C78 77 65 90 50 95
             C35 90 22 77 18 57
             L12 20 Z"
          fill="url(#shieldGradient)"
          stroke="#F5C542"
          stroke-width="4"
        />

        <path
          d="M31 43
             Q50 29 69 43
             L65 49
             Q50 40 35 49 Z"
          fill="#ffffff"
        />

        <circle
          cx="50"
          cy="54"
          r="5"
          fill="#F5C542"
        />

        <path
          d="M50 59 L50 76"
          stroke="#ffffff"
          stroke-width="4"
          stroke-linecap="round"
        />

        <path
          d="M37 76 L63 76"
          stroke="#ffffff"
          stroke-width="4"
          stroke-linecap="round"
        />

        <path
          d="M42 65 L34 74
             M58 65 L66 74"

}

/* =========================================================

   ========================================================= */

function escapeHtml(text) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function formatAnswer(text) {

  let safe =
    escapeHtml(text);

  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  safe =
    safe.replace(
      /\n/g,
      "<br>"
    );

  return safe;
}

}

/* =========================================================

   ========================================================= */

function extractSources(text) {

  const sourceMatch =
    text.match(
      /📖\s*Source:\s*(.*)/i
    );

  const sectionMatch =
    text.match(
      /📑\s*Section:\s*(.*)/i
    );

  const pageMatch =
    text.match(
      /📄\s*Page:\s*(.*)/i
    );


  if (
    !sourceMatch &&
    !sectionMatch &&
    !pageMatch
  ) {

    return null;

  }


  return {

    source:
      sourceMatch
        ? sourceMatch[1].trim()
        : "Police AI Knowledge Base",

    section:
      sectionMatch
        ? sectionMatch[1].trim()
        : "—",

    page:
      pageMatch
        ? pageMatch[1].trim()
        : "—"

  };

}


function addSourceCard(
  bubble,
  text
) {

  const source =
    extractSources(text);

  if (!source) {
    return;
  }


  const card =
    document.createElement(
      "div"
    );

  card.className =
    "source-card";


  card.innerHTML = `
    <div class="source-title">
      📚 Source Reference
    </div>

    <div class="source-item">
      <span class="source-label">
        Source:
      </span>

      <span>
        ${escapeHtml(
          source.source
        )}
      </span>
    </div>

    <div class="source-item">
      <span class="source-label">
        Section:
      </span>

      <span>
        ${escapeHtml(
          source.section
        )}
      </span>
    </div>

    <div class="source-item">
      <span class="source-label">
        Page:
      </span>

      <span>
        ${escapeHtml(
          source.page
        )}
      </span>
    </div>
  `;


  bubble.appendChild(
    card
  );

}

function addMessageActions(

            copyBtn.textContent =
              "Copy";

      "button"
    );

    "small-btn";

  readBtn.type =

        return;

      }


      speechSynthesis.cancel();

            ""
          )
          .replace(
            /📄.*$/g,
            ""
          )
          .replace(
            /\*\*/g,
            ""
          );


      const utterance =
        new SpeechSynthesisUtterance(

        );


      utterance.lang =
        "en-IN";

      utterance.rate =
        .95;

      utterance.pitch =
        1;

    "small-btn";

      if (
        "speechSynthesis" in window
      ) {

        speechSynthesis.cancel();

      }

    }
  );


  actions.appendChild(
    copyBtn
  );

  actions.appendChild(
    readBtn
  );

  actions.appendChild(
    stopBtn
  );


  bubble.appendChild(
    actions
  );

}


/* =========================================================
   ASK POLICE AI
   ========================================================= */

let isAsking =
  false;


async function askPoliceAI(
  suppliedQuestion = null
) {

  if (isAsking) {
    return;
  }


  const text =
    suppliedQuestion !== null
      ? suppliedQuestion.trim()
      : question.value.trim();


  if (!text) {
    return;
  }


  addMessage(
    text,
    "user"
  );


  question.value =
    "";

  resizeTextarea();


  isAsking =
    true;


  sendBtn.disabled =
    true;

  micBtn.disabled =
    true;


  addTyping();


  try {

    const result =
      await supabaseClient
        .functions
        .invoke(
          CHAT_FUNCTION_NAME,
          {
            body: {
              question: text,
              law: selectedLaw
            }
          }
        );


    removeTyping();


    if (result.error) {

      console.error(
        "Supabase error:",
        result.error
      );


      addMessage(
        "Connection error. Please check your internet connection and try again.",
        "assistant"
      );

      return;
    }


    const data =
      result.data || {};


    const answer =
      data.reply ||
      data.answer ||
      data.message ||
      "I couldn't find an answer.";


    const bubble =
      addMessage(
        answer,
        "assistant"
      );


    addSourceCard(
      bubble,
      answer
    );


    addMessageActions(
      bubble,
      answer
    );


    scrollToBottom();


  } catch (error) {

    console.error(
      "Police AI error:",
      error
    );


    removeTyping();


    addMessage(
      "Connection error. Please check your internet connection and try again.",
      "assistant"
    );


  } finally {

    isAsking =
      false;

    sendBtn.disabled =
      false;

    micBtn.disabled =
      false;

    question.focus();

  }

}

/* =========================================================
   VOICE INPUT
   ========================================================= */

let recognition =
  null;

let recognizing =
  false;

let finalTranscript =
  "";


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      recognizing =
        true;


      micBtn.classList.add(
        "recording"
      );


      voiceOverlay.classList.add(
        "active"
      );


      voiceStatus.textContent =
        "I'm listening";

    };


  recognition.onaudiostart =
    () => {

      voiceStatus.textContent =
        "Hearing you…";

    };


  recognition.onspeechstart =
    () => {

      voiceStatus.textContent =
        "Listening to your question…";

    };


  recognition.onresult =
    event => {

      let interim =
        "";

      finalTranscript =
        "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript;


        if (
          event.results[i].isFinal
        ) {

          finalTranscript +=
            transcript;

        } else {

          interim +=
            transcript;

        }

      }


      const combined =
        (
          finalTranscript ||
          interim
        ).trim();


      question.value =
        combined;


      resizeTextarea();


      voiceStatus.textContent =
        combined ||
        "I'm listening…";

    };


  recognition.onspeechend =
    () => {

      voiceStatus.textContent =
        "Processing…";

    };


  recognition.onerror =
    event => {

      console.error(
        "Speech recognition error:",
        event.error
      );


      voiceStatus.textContent =
        "Voice input stopped";


      setTimeout(
        closeVoiceOverlay,
        500
      );

    };


  recognition.onend =
    () => {

      recognizing =
        false;


      micBtn.classList.remove(
        "recording"
      );


      const spoken =
        (
          finalTranscript ||
          question.value
        ).trim();


      setTimeout(
        closeVoiceOverlay,
        450
      );


      if (
        spoken &&
        !isAsking
      ) {

        question.value =
          "";

        resizeTextarea();


        askPoliceAI(
          spoken
        );

      }

    };

}


/* =========================================================
   START VOICE
   ========================================================= */

function startVoice() {

  if (!recognition) {

    alert(
      "Voice input is not supported on this device."
    );

    return;

  }


  if (recognizing) {
    return;
  }


  finalTranscript =
    "";


  question.value =
    "";


  resizeTextarea();


  voiceStatus.textContent =
    "Starting microphone…";


  try {

    recognition.start();

  } catch (error) {

    console.error(
      error
    );

  }

}


micBtn.addEventListener(
  "click",
  startVoice
);


/* =========================================================
   STOP VOICE
   ========================================================= */

function closeVoiceOverlay() {

  voiceOverlay.classList.remove(
    "active"
  );


  micBtn.classList.remove(
    "recording"
  );

}


function stopVoice() {

  if (
    recognition &&
    recognizing
  ) {

    try {

      recognition.stop();

    } catch (error) {

      console.error(
        error
      );

    }

  }


  closeVoiceOverlay();

}


stopVoiceBtn.addEventListener(
  "click",
  stopVoice
);

/*
  Recalculate the app after orientation changes,
  keyboard changes, or WebView size changes.
*/

function updateViewportHeight() {

  const viewport =
    window.visualViewport;

  if (!viewport) {
    return;
  }


  document.documentElement
    .style
    .setProperty(
      "--visual-height",
      viewport.height + "px"
    );

}


if (window.visualViewport) {

  window.visualViewport.addEventListener(
    "resize",
    updateViewportHeight
  );

  window.visualViewport.addEventListener(
    "scroll",
    updateViewportHeight
  );

}


window.addEventListener(
  "resize",
  () => {

    updateViewportHeight();

    resizeTextarea();

    scrollToBottom();

  }
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      () => {

        updateViewportHeight();

        resizeTextarea();

      },
      250
    );

  }
);
