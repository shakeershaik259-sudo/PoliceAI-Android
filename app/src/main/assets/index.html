<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#061A3A">

<title>Police AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* =========================================================
   POLICE AI
   STAGE 2 - BRANDED WELCOME + CHAT
   ========================================================= */

:root {
  --bg: #f7f9fc;
  --panel: #ffffff;
  --panel2: #f1f5f9;
  --text: #101828;
  --muted: #667085;
  --border: #e4e7ec;
  --accent: #2563eb;
  --accent2: #0ea5e9;
  --user: #e8f0ff;
  --assistant: #ffffff;
  --danger: #dc2626;
  --shadow: 0 8px 30px rgba(15, 23, 42, .08);
}

[data-theme="dark"] {
  --bg: #080c13;
  --panel: #0f1722;
  --panel2: #121c29;
  --text: #f3f6fb;
  --muted: #9aa8ba;
  --border: #233044;
  --accent: #3b82f6;
  --accent2: #22d3ee;
  --user: #12284b;
  --assistant: #0f1722;
  --danger: #ef4444;
  --shadow: 0 12px 40px rgba(0,0,0,.35);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

/* =========================================================
   STAGE 2 WELCOME SCREEN
   ========================================================= */

#welcomeScreen {
  position: fixed;
  inset: 0;
  z-index: 9999;

  background: #061A3A;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  opacity: 1;
  visibility: visible;

  transition:
    opacity .55s ease,
    visibility .55s ease;
}

#welcomeScreen.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.welcome-image {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  opacity: .98;

  animation: welcomeZoom 8s ease-in-out infinite alternate;
}

.welcome-overlay {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      180deg,
      rgba(2, 10, 30, .05),
      rgba(2, 10, 30, .15)
    );

  pointer-events: none;
}

.welcome-content {
  position: relative;
  z-index: 2;

  width: min(88%, 430px);

  display: flex;
  flex-direction: column;
  align-items: center;

  margin-top: auto;
  margin-bottom: 38px;

  animation: welcomeContent .8s ease both;
}

.welcome-start {
  border: 0;

  min-width: 190px;
  min-height: 48px;

  padding: 12px 28px;

  border-radius: 28px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #0ea5e9
    );

  color: white;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: .2px;

  box-shadow:
    0 8px 28px rgba(37,99,235,.38);

  cursor: pointer;

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.welcome-start:active {
  transform: scale(.96);
}

.welcome-start:hover {
  box-shadow:
    0 12px 34px rgba(37,99,235,.5);
}

.welcome-hint {
  margin-top: 12px;

  color: rgba(255,255,255,.75);

  font-size: 11px;

  text-align: center;
}

/* =========================================================
   MAIN APPLICATION
   ========================================================= */

#app {
  position: fixed;
  inset: 0;

  display: flex;
  flex-direction: column;

  background: var(--bg);

  opacity: 0;
  transform: scale(.985);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

#app.ready {
  opacity: 1;
  transform: scale(1);
}

/* =========================================================
   HEADER
   ========================================================= */

header {
  height: 58px;
  min-height: 58px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 12px;

  background: var(--panel);

  border-bottom: 1px solid var(--border);

  position: relative;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;

  min-width: 0;
}

.logo {
  width: 36px;
  height: 36px;

  flex: 0 0 36px;

  animation: logoFloat 4s ease-in-out infinite;
}

.brand-text {
  min-width: 0;
}

.brand-title {
  font-size: 15px;
  font-weight: 800;

  line-height: 18px;

  white-space: nowrap;
}

.brand-subtitle {
  font-size: 9px;
  letter-spacing: 1.2px;

  color: var(--muted);

  font-weight: 700;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}

.icon-btn {
  width: 38px;
  height: 38px;

  border: 1px solid var(--border);

  border-radius: 11px;

  background: var(--panel2);

  color: var(--text);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 17px;

  cursor: pointer;

  transition:
    transform .15s ease,
    background .2s ease;
}

.icon-btn:active {
  transform: scale(.92);
}

/* =========================================================
   LAW SELECTOR
   ========================================================= */

.law-bar {
  height: 43px;
  min-height: 43px;

  display: flex;
  align-items: center;

  padding: 0 12px;

  background: var(--panel);

  border-bottom: 1px solid var(--border);
}

.law-select {
  width: auto;

  min-width: 150px;

  border: 1px solid var(--border);

  border-radius: 9px;

  background: var(--panel2);

  color: var(--text);

  padding: 7px 10px;

  font-size: 12px;
  font-weight: 700;

  outline: none;
}

/* =========================================================
   CHAT AREA
   ========================================================= */

#chat {
  flex: 1;

  overflow-y: auto;

  padding:
    12px
    10px
    8px;

  display: flex;
  flex-direction: column;

  gap: 9px;

  scroll-behavior: smooth;

  overscroll-behavior: contain;
}

#chat::-webkit-scrollbar {
  width: 4px;
}

#chat::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 10px;
}

/* =========================================================
   WELCOME MESSAGE
   ========================================================= */

.chat-welcome {
  margin: 8px auto 3px;

  width: min(94%, 520px);

  text-align: center;

  animation: fadeUp .45s ease both;
}

.chat-welcome-icon {
  width: 58px;
  height: 58px;

  margin: 3px auto 10px;

  animation:
    logoFloat 4s ease-in-out infinite,
    softGlow 3s ease-in-out infinite alternate;
}

.chat-welcome h1 {
  margin: 0;

  font-size: 22px;

  letter-spacing: -.3px;
}

.chat-welcome p {
  margin: 5px 0 13px;

  color: var(--muted);

  font-size: 12px;
}

/* =========================================================
   SUGGESTIONS
   ========================================================= */

.suggestions {
  display: flex;

  flex-wrap: wrap;

  justify-content: center;

  gap: 6px;
}

.suggestion {
  border: 1px solid var(--border);

  background: var(--panel);

  color: var(--text);

  border-radius: 16px;

  padding: 7px 10px;

  font-size: 11px;

  cursor: pointer;

  transition:
    transform .15s ease,
    border-color .2s ease,
    background .2s ease;
}

.suggestion:active {
  transform: scale(.96);
}

.suggestion:hover {
  border-color: var(--accent);
}

/* =========================================================
   MESSAGE ROWS
   ========================================================= */

.message-row {
  display: flex;

  width: 100%;

  margin: 0;

  animation: messageIn .25s ease both;
}

.message-row.user {
  justify-content: flex-end;
}

.message-row.assistant {
  justify-content: flex-start;
}

.message {
  width: fit-content;

  max-width: min(88%, 720px);

  border-radius: 14px;

  padding: 8px 10px;

  line-height: 1.48;

  font-size: 13px;

  white-space: pre-wrap;

  word-break: break-word;

  border: 1px solid var(--border);

  box-shadow: 0 2px 8px rgba(0,0,0,.025);
}

.message.user {
  background: var(--user);

  border-color: rgba(37,99,235,.16);
}

.message.assistant {
  background: var(--assistant);
}

.message strong {
  font-weight: 750;
}

.message em {
  opacity: .9;
}

.message-actions {
  display: flex;

  gap: 5px;

  margin-top: 7px;
}

.small-btn {
  border: 1px solid var(--border);

  background: var(--panel2);

  color: var(--muted);

  border-radius: 8px;

  padding: 5px 8px;

  font-size: 10px;

  cursor: pointer;
}

.small-btn:active {
  transform: scale(.95);
}

/* =========================================================
   SOURCE CARD
   ========================================================= */

.source-card {
  margin-top: 8px;

  border: 1px solid var(--border);

  background: var(--panel2);

  border-radius: 10px;

  padding: 7px 9px;

  font-size: 10px;

  animation: sourceIn .3s ease both;
}

.source-title {
  font-size: 10px;

  font-weight: 800;

  margin-bottom: 3px;

  color: var(--text);
}

.source-item {
  display: flex;

  align-items: flex-start;

  gap: 7px;

  padding: 3px 0;

  margin: 0;

  color: var(--muted);

  line-height: 1.25;
}

.source-label {
  color: var(--text);

  font-weight: 700;

  flex: 0 0 auto;
}

/* =========================================================
   TYPING
   ========================================================= */

.typing {
  display: inline-flex;

  align-items: center;

  gap: 4px;

  padding: 4px 2px;
}

.dot {
  width: 5px;
  height: 5px;

  border-radius: 50%;

  background: var(--accent);

  animation: typingDot 1.1s infinite ease-in-out;
}

.dot:nth-child(2) {
  animation-delay: .15s;
}

.dot:nth-child(3) {
  animation-delay: .3s;
}

/* =========================================================
   COMPOSER
   ========================================================= */

.composer-wrap {
  padding:
    7px
    9px
    max(
      8px,
      env(safe-area-inset-bottom)
    );

  background: var(--bg);

  border-top: 1px solid var(--border);
}

.composer {
  width: 100%;

  display: flex;
  align-items: flex-end;

  gap: 6px;

  padding: 5px;

  background: var(--panel);

  border: 1px solid var(--border);

  border-radius: 15px;

  box-shadow: var(--shadow);
}

#question {
  flex: 1;

  min-width: 0;

  height: 38px;

  max-height: 100px;

  resize: none;

  overflow-y: auto;

  border: 0;

  outline: 0;

  background: transparent;

  color: var(--text);

  padding: 9px 7px;

  font-family: inherit;

  font-size: 13px;

  line-height: 20px;
}

#question::placeholder {
  color: var(--muted);
}

.send-btn,
.mic-btn {
  width: 36px;
  height: 36px;

  flex: 0 0 36px;

  border: 0;

  border-radius: 11px;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  font-size: 16px;
}

.send-btn {
  background: var(--accent);

  color: white;
}

.mic-btn {
  background: var(--panel2);

  color: var(--text);

  border: 1px solid var(--border);
}

.mic-btn.recording {
  background: #dc2626;

  color: white;

  animation: micPulse 1s infinite;
}

.footer-note {
  text-align: center;

  color: var(--muted);

  font-size: 8px;

  margin-top: 5px;

  opacity: .8;
}

/* =========================================================
   VOICE LISTENING OVERLAY
   ========================================================= */

#voiceOverlay {
  position: fixed;

  inset: 0;

  z-index: 10000;

  display: none;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  background:
    radial-gradient(
      circle at center,
      rgba(20, 74, 150, .75),
      rgba(3, 8, 20, .97)
    );

  backdrop-filter: blur(12px);
}

#voiceOverlay.active {
  display: flex;
}

.voice-orb {
  width: 130px;
  height: 130px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 52px;

  background:
    radial-gradient(
      circle,
      #38bdf8 0%,
      #2563eb 45%,
      #172554 72%
    );

  box-shadow:
    0 0 0 12px rgba(37,99,235,.12),
    0 0 0 28px rgba(37,99,235,.06),
    0 0 55px rgba(14,165,233,.55);

  animation:
    voiceOrb 1.35s infinite ease-in-out;
}

.voice-title {
  margin-top: 24px;

  color: white;

  font-size: 22px;

  font-weight: 800;
}

.voice-status {
  margin-top: 6px;

  color: rgba(255,255,255,.72);

  font-size: 13px;
}

.voice-waves {
  display: flex;

  align-items: center;

  justify-content: center;

  gap: 4px;

  height: 45px;

  margin-top: 18px;
}

.wave {
  width: 4px;

  height: 12px;

  border-radius: 10px;

  background: #38bdf8;

  animation: wave 1s infinite ease-in-out;
}

.wave:nth-child(2) { animation-delay: .1s; }
.wave:nth-child(3) { animation-delay: .2s; }
.wave:nth-child(4) { animation-delay: .3s; }
.wave:nth-child(5) { animation-delay: .4s; }

.stop-recording {
  margin-top: 28px;

  border: 1px solid rgba(255,255,255,.2);

  background: rgba(255,255,255,.08);

  color: white;

  border-radius: 24px;

  padding: 10px 22px;

  font-size: 12px;

  cursor: pointer;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes welcomeZoom {
  from {
    transform: scale(1);
  }
  to {
    transform: scale(1.045);
  }
}

@keyframes welcomeContent {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes logoFloat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-2px);
  }
}

@keyframes softGlow {
  from {
    filter: drop-shadow(0 0 2px rgba(37,99,235,.15));
  }

  to {
    filter: drop-shadow(0 0 9px rgba(37,99,235,.45));
  }
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes messageIn {
  from {
    opacity: 0;
    transform: translateY(5px) scale(.99);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes sourceIn {
  from {
    opacity: 0;
    transform: translateY(3px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes typingDot {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .45;
  }

  30% {
    transform: translateY(-4px);
    opacity: 1;
  }
}

@keyframes micPulse {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(220,38,38,.3);
  }

  50% {
    box-shadow: 0 0 0 7px rgba(220,38,38,.08);
  }
}

@keyframes voiceOrb {
  0%, 100% {
    transform: scale(.96);
  }

  50% {
    transform: scale(1.05);
  }
}

@keyframes wave {
  0%, 100% {
    height: 10px;
    opacity: .5;
  }

  50% {
    height: 38px;
    opacity: 1;
  }
}

/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 360px) {

  .brand-title {
    font-size: 14px;
  }

  .brand-subtitle {
    font-size: 8px;
  }

  .message {
    font-size: 12px;
  }

  .chat-welcome h1 {
    font-size: 20px;
  }

  .welcome-content {
    margin-bottom: 25px;
  }

  .welcome-start {
    min-width: 175px;
  }
}
</style>
</head>

<body>

<!-- =======================================================
     STAGE 2 WELCOME SCREEN
     ======================================================= -->

<div id="welcomeScreen">

  <img
    class="welcome-image"
    src="welcome_screen.png"
    alt="Police AI Law Assistant"
  >

  <div class="welcome-overlay"></div>

  <div class="welcome-content">

    <button
      id="startAppBtn"
      class="welcome-start"
      type="button"
    >
      Get Started
    </button>

    <div class="welcome-hint">
      AI-powered assistance for your legal knowledge
    </div>

  </div>
</div>


<!-- =======================================================
     MAIN APP
     ======================================================= -->

<div id="app">

  <!-- HEADER -->
  <header>

    <div class="brand">

      <!-- Police shield logo -->
      <svg
        class="logo"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient
            id="shieldGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#2563EB"
            />
            <stop
              offset="100%"
              stop-color="#0EA5E9"
            />
          </linearGradient>
        </defs>

        <path
          d="M50 6
             L88 20
             L82 57
             C78 77 65 90 50 95
             C35 90 22 77 18 57
             L12 20 Z"
          fill="url(#shieldGradient)"
          stroke="#F5C542"
          stroke-width="4"
        />

        <path
          d="M31 43
             Q50 29 69 43
             L65 49
             Q50 40 35 49 Z"
          fill="#ffffff"
        />

        <circle
          cx="50"
          cy="54"
          r="5"
          fill="#F5C542"
        />

        <path
          d="M50 59 L50 76"
          stroke="#ffffff"
          stroke-width="4"
          stroke-linecap="round"
        />

        <path
          d="M37 76 L63 76"
          stroke="#ffffff"
          stroke-width="4"
          stroke-linecap="round"
        />

        <path
          d="M42 65 L34 74
             M58 65 L66 74"
          stroke="#22D3EE"
          stroke-width="3"
          stroke-linecap="round"
        />

      </svg>

      <div class="brand-text">
        <div class="brand-title">
          Police AI
        </div>

        <div class="brand-subtitle">
          LAW ASSISTANT
        </div>
      </div>

    </div>

    <div class="header-actions">

      <button
        id="themeBtn"
        class="icon-btn"
        type="button"
        title="Change theme"
      >
        🌙
      </button>

      <button
        id="newChatBtn"
        class="icon-btn"
        type="button"
        title="New chat"
      >
        ＋
      </button>

    </div>

  </header>


  <!-- LAW SELECTOR -->
  <div class="law-bar">

    <select
      id="lawSelect"
      class="law-select"
    >
      <option value="BNS">
        BNS — Bharatiya Nyaya Sanhita
      </option>

      <option value="BNSS">
        BNSS — Bharatiya Nagarik Suraksha Sanhita
      </option>

      <option value="BSA">
        BSA — Bharatiya Sakshya Adhiniyam
      </option>
    </select>

  </div>


  <!-- CHAT -->
  <main id="chat">

    <div
      id="welcomeMessage"
      class="chat-welcome"
    >

      <svg
        class="chat-welcome-icon"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M50 6
             L88 20
             L82 57
             C78 77 65 90 50 95
             C35 90 22 77 18 57
             L12 20 Z"
          fill="#2563EB"
          stroke="#F5C542"
          stroke-width="4"
        />

        <circle
          cx="50"
          cy="48"
          r="15"
          fill="#ffffff"
        />

        <path
          d="M50 37 L50 59
             M39 48 L61 48"
          stroke="#2563EB"
          stroke-width="4"
          stroke-linecap="round"
        />

        <path
          d="M40 69 L50 60 L60 69"
          stroke="#22D3EE"
          stroke-width="4"
          fill="none"
        />
      </svg>

      <h1>
        How can I help you?
      </h1>

      <p>
        Ask a question about Indian criminal law.
      </p>

      <div class="suggestions">

        <button
          class="suggestion"
          type="button"
          data-question="What is culpable homicide?"
        >
          What is culpable homicide?
        </button>

        <button
          class="suggestion"
          type="button"
          data-question="What is theft?"
        >
          What is theft?
        </button>

        <button
          class="suggestion"
          type="button"
          data-question="What is criminal intimidation?"
        >
          Criminal intimidation
        </button>

        <button
          class="suggestion"
          type="button"
          data-question="What is the punishment for murder?"
        >
          Punishment for murder
        </button>

      </div>

    </div>

  </main>


  <!-- COMPOSER -->
  <div class="composer-wrap">

    <div class="composer">

      <textarea
        id="question"
        rows="1"
        placeholder="Ask Police AI..."
        autocomplete="off"
        spellcheck="true"
      ></textarea>

      <button
        id="micBtn"
        class="mic-btn"
        type="button"
        title="Voice input"
      >
        🎙️
      </button>

      <button
        id="sendBtn"
        class="send-btn"
        type="button"
        title="Send"
      >
        ➤
      </button>

    </div>

    <div class="footer-note">
      Police AI • Law Assistant
    </div>

  </div>

</div>


<!-- =======================================================
     VOICE OVERLAY

function applyTheme(theme) {

    "data-theme",
    theme

  localStorage.setItem(
    "police_ai_theme",
    theme
  );

  themeBtn.textContent =
    theme === "dark" ? "☀️" : "🌙";
}


const savedTheme =
  localStorage.getItem("police_ai_theme");

  applyTheme(savedTheme);

} else {

  const prefersDark =
    window.matchMedia &&
    window.matchMedia(
      "(prefers-color-scheme: dark)"
    ).matches;

  applyTheme(
    prefersDark ? "dark" : "light"
  );

}


themeBtn.addEventListener(
  "click",
  () => {

    const current =
      document.documentElement

/* ---------------------------------------------------------
   TEXTAREA AUTO RESIZE
   --------------------------------------------------------- */

function resizeTextarea() {

  question.style.height = "38px";

  const newHeight =
    Math.min(
      question.scrollHeight,
      100

  question.style.height =

/* ---------------------------------------------------------

   --------------------------------------------------------- */

question.addEventListener(

      !event.shiftKey

      event.preventDefault();

/* ---------------------------------------------------------
   MARKDOWN-LIKE TEXT
   --------------------------------------------------------- */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatAnswer(text) {

  let safe =
    escapeHtml(text);

  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  safe =
    safe.replace(
      /\n/g,
      "<br>"
    );

  return safe;
}


/* ---------------------------------------------------------
   ADD MESSAGE
   --------------------------------------------------------- */

function addMessage(
  text,
  type = "assistant"
) {

  const row =
    document.createElement("div");

  row.className =
    "message-row " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "message " + type;

  bubble.innerHTML =
    formatAnswer(text);

  row.appendChild(bubble);

  chat.appendChild(row);

  scrollToBottom();

  return bubble;
}


/* ---------------------------------------------------------
   TYPING
   --------------------------------------------------------- */

function addTyping() {

  const row =
    document.createElement("div");

  row.className =
    "message-row assistant";

  row.id =
    "typingRow";

  const bubble =
    document.createElement("div");

  bubble.className =
    "message assistant";

  bubble.innerHTML = `
    <div class="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  `;

  row.appendChild(bubble);

  chat.appendChild(row);

  scrollToBottom();
}


function removeTyping() {

  const typing =
    document.getElementById(
      "typingRow"
    );

  if (typing) {
    typing.remove();
  }

}


/* ---------------------------------------------------------
   SCROLL
   --------------------------------------------------------- */

function scrollToBottom() {

  setTimeout(() => {

    chat.scrollTop =
      chat.scrollHeight;

  }, 30);

}


/* ---------------------------------------------------------
   SOURCE CARD
   --------------------------------------------------------- */

function extractSources(text) {

  const sourceMatch =
    text.match(
      /📖\s*Source:\s*(.*)/i
    );

  const sectionMatch =
    text.match(
      /📑\s*Section:\s*(.*)/i
    );

  const pageMatch =
    text.match(
      /📄\s*Page:\s*(.*)/i
    );

  if (
    !sourceMatch &&
    !sectionMatch &&
    !pageMatch
  ) {
    return null;
  }

  return {
    source:
      sourceMatch
        ? sourceMatch[1].trim()
        : "Police AI Knowledge Base",

    section:
      sectionMatch
        ? sectionMatch[1].trim()
        : "—",

    page:
      pageMatch
        ? pageMatch[1].trim()
        : "—"
  };

}


function addSourceCard(
  bubble,
  text
) {

  const source =
    extractSources(text);

  if (!source) {
    return;
  }

  const card =
    document.createElement("div");

  card.className =
    "source-card";

  card.innerHTML = `
    <div class="source-title">
      📚 Source Reference
    </div>

    <div class="source-item">
      <span class="source-label">
        Source:
      </span>
      <span>
        ${escapeHtml(source.source)}
      </span>
    </div>

    <div class="source-item">
      <span class="source-label">
        Section:
      </span>
      <span>
        ${escapeHtml(source.section)}
      </span>
    </div>

    <div class="source-item">
      <span class="source-label">
        Page:
      </span>
      <span>
        ${escapeHtml(source.page)}
      </span>
    </div>
  `;

  bubble.appendChild(card);
}


/* ---------------------------------------------------------
   MESSAGE ACTIONS
   --------------------------------------------------------- */

function addMessageActions(
  bubble,
  text
) {

  const actions =
    document.createElement("div");

  actions.className =
    "message-actions";

  const copyBtn =
    document.createElement("button");

  copyBtn.className =
    "small-btn";

  copyBtn.textContent =
    "Copy";

  copyBtn.type =
    "button";

  copyBtn.addEventListener(
    "click",
    async () => {

      try {

        await navigator.clipboard.writeText(
          text
        );

        copyBtn.textContent =
          "Copied ✓";

        setTimeout(() => {

          copyBtn.textContent =
            "Copy";

        }, 1200);

      } catch {

        copyBtn.textContent =
          "Copy failed";

      }

    }
  );


  const readBtn =
    document.createElement("button");

  readBtn.className =
    "small-btn";

  readBtn.textContent =
    "🔊 Read";

  readBtn.type =
    "button";

  readBtn.addEventListener(
    "click",
    () => {

      if (
        !("speechSynthesis" in window)
      ) {
        return;
      }

      speechSynthesis.cancel();

      const cleanText =
        text
          .replace(/📖.*$/g, "")
          .replace(/📑.*$/g, "")
          .replace(/📄.*$/g, "")
          .replace(/\*\*/g, "");

      const utterance =
        new SpeechSynthesisUtterance(
          cleanText
        );

      utterance.lang =
        "en-IN";

      utterance.rate =
        0.95;

      utterance.pitch =
        1;

      speechSynthesis.speak(
        utterance
      );

    }
  );


  const stopBtn =
    document.createElement("button");

  stopBtn.className =
    "small-btn";

  stopBtn.textContent =
    "⏹ Stop";

  stopBtn.type =
    "button";

  stopBtn.addEventListener(
    "click",
    () => {

      if (
        "speechSynthesis" in window
      ) {
        speechSynthesis.cancel();
      }

    }
  );


  actions.appendChild(copyBtn);
  actions.appendChild(readBtn);
  actions.appendChild(stopBtn);

  bubble.appendChild(actions);
}


/* ---------------------------------------------------------
   ASK POLICE AI
   --------------------------------------------------------- */

let isAsking =
  false;


async function askPoliceAI(
  suppliedQuestion = null
) {

  if (isAsking) {
    return;
  }

  const text =
    suppliedQuestion !== null
      ? suppliedQuestion.trim()
      : question.value.trim();

  if (!text) {
    return;
  }


  /* USER MESSAGE */

  addMessage(
    text,
    "user"
  );

  question.value = "";

  resizeTextarea();


  /* TYPING */

  isAsking = true;

  sendBtn.disabled = true;
  micBtn.disabled = true;

  addTyping();


  try {

    /*
      IMPORTANT:
      Keep this request format unchanged.

      Your working Supabase Edge Function
      expects "question" and "law".
    */

    const result =
      await supabaseClient
        .functions
        .invoke(
          CHAT_FUNCTION_NAME,
          {
            body: {
              question: text,
              law: selectedLaw
            }
          }
        );


    removeTyping();


    if (result.error) {

      console.error(
        "Supabase error:",
        result.error
      );

      const errorBubble =
        addMessage(
          "Connection error. Please check your internet connection and try again.",
          "assistant"
        );

      return;
    }


    const data =
      result.data || {};


    const answer =
      data.reply ||
      data.answer ||
      data.message ||
      "I couldn't find an answer.";


    const bubble =
      addMessage(
        answer,
        "assistant"
      );


    addSourceCard(
      bubble,
      answer
    );


    addMessageActions(
      bubble,
      answer
    );


    scrollToBottom();


  } catch (error) {

    console.error(
      "Police AI error:",
      error
    );

    removeTyping();

    addMessage(
      "Connection error. Please check your internet connection and try again.",
      "assistant"
    );

  } finally {

    isAsking = false;

    sendBtn.disabled = false;
    micBtn.disabled = false;

    question.focus();

  }

}


/* ---------------------------------------------------------
   SEND BUTTON
   --------------------------------------------------------- */

sendBtn.addEventListener(

  () => {
    askPoliceAI();

);

/* =========================================================
   VOICE INPUT
   ========================================================= */

let recognition = null;

let recognizing =
  false;

let finalTranscript =
  "";


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      recognizing =
        true;

      micBtn.classList.add(
        "recording"
      );

      voiceOverlay.classList.add(
        "active"
      );

      voiceStatus.textContent =
        "I'm listening";

    };


  recognition.onaudiostart =
    () => {

      voiceStatus.textContent =
        "Hearing you…";

    };


  recognition.onspeechstart =
    () => {

      voiceStatus.textContent =
        "Listening to your question…";

    };


  recognition.onresult =
    (event) => {

      let interim =
        "";

      finalTranscript =
        "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =
          event.results[i][0]
            .transcript;

        if (
          event.results[i].isFinal
        ) {

          finalTranscript +=
            transcript;

        } else {

          interim +=
            transcript;

        }

      }


      const combined =
        (
          finalTranscript ||
          interim
        ).trim();


      question.value =
        combined;

      resizeTextarea();

      voiceStatus.textContent =
        combined
          ? combined
          : "I'm listening…";

    };


  recognition.onspeechend =
    () => {

      voiceStatus.textContent =
        "Processing…";

    };


  recognition.onerror =
    (event) => {

      console.error(
        "Speech recognition error:",
        event.error
      );

      voiceStatus.textContent =
        "Voice input stopped";

      setTimeout(
        closeVoiceOverlay,
        500
      );

    };


  recognition.onend =
    () => {

      recognizing =
        false;

      micBtn.classList.remove(
        "recording"
      );


      const spoken =
        (
          finalTranscript ||
          question.value
        ).trim();


      setTimeout(
        closeVoiceOverlay,
        450
      );


      if (
        spoken &&
        !isAsking
      ) {

        question.value =
          "";

        resizeTextarea();

        askPoliceAI(
          spoken
        );

      }

    };

} else {

  console.warn(
    "SpeechRecognition is not supported."
  );

}


/* ---------------------------------------------------------
   START VOICE
   --------------------------------------------------------- */

function startVoice() {

  if (!recognition) {

    alert(
      "Voice input is not supported on this device."
    );

    return;

  }

  if (recognizing) {
    return;
  }


  finalTranscript =
    "";

  question.value =
    "";

  voiceStatus.textContent =
    "Starting microphone…";


  try {

    recognition.start();

  } catch (error) {

    console.error(
      error
    );

  }

}


micBtn.addEventListener(
  "click",
  startVoice
);


/* ---------------------------------------------------------
   STOP VOICE
   --------------------------------------------------------- */

function closeVoiceOverlay() {

  voiceOverlay.classList.remove(
    "active"
  );

  micBtn.classList.remove(
    "recording"
  );

}


function stopVoice() {

  if (
    recognition &&
    recognizing
  ) {

    try {
      recognition.stop();
    } catch (error) {
      console.error(error);
    }

  }

  closeVoiceOverlay();

}


stopVoiceBtn.addEventListener(
  "click",
  stopVoice
);


/* ---------------------------------------------------------
   INITIAL STATE
   --------------------------------------------------------- */

resizeTextarea();

console.log(
  "Police AI Stage 2 loaded successfully."
);

</script>
